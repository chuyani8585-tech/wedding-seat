<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>11/22 琪鈞&amp;亞霓婚禮 座位查詢</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2ef;--surface:#fbfcfb;--ink:#1d3336;--muted:#5d7275;--line:#c9d5d0;--accent:#a8505f;--accent-ink:#fff;--table:#dfe8e4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14201f;--surface:#1c2c2b;--ink:#e6efec;--muted:#98aeaa;--line:#32484a;--accent:#d98393;--accent-ink:#1a1214;--table:#274040;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14201f;--surface:#1c2c2b;--ink:#e6efec;--muted:#98aeaa;--line:#32484a;--accent:#d98393;--accent-ink:#1a1214;--table:#274040;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif TC","Songti TC",serif;line-height:1.8}
main{max-width:640px;margin:0 auto;padding:40px 20px 56px}
h1{font-size:clamp(24px,6vw,36px);font-weight:600;letter-spacing:.12em;margin:0 0 4px;text-align:center}
.sub{text-align:center;color:var(--muted);margin:0 0 32px}
form{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;font-size:18px;padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
button{font:inherit;padding:12px 22px;border:0;border-radius:6px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#out{margin-top:28px}
.msg{color:var(--muted);text-align:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:16px;cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit}
.card.sel{border-color:var(--accent);border-width:2px}
.card .nm{font-size:20px;font-weight:600}
.card .tb{font-size:28px;color:var(--accent);font-weight:600;white-space:nowrap}
.ct{color:var(--muted);font-size:16px}
.map{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.floor{position:relative;width:100%;aspect-ratio:560/590;container-type:inline-size}
.stage{position:absolute;left:33%;top:.8%;width:31.25%;height:11.9%;background:var(--table);border-radius:4px;display:grid;place-items:center;color:var(--muted);font-size:clamp(10px,2.8cqw,15px)}
.aisle{position:absolute;left:45.5%;top:36.4%;width:6.2%;height:63%;background:#c0392b;opacity:.75;border-radius:2px}
.t{position:absolute;width:9.3%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:var(--table);display:grid;place-items:center;font-size:clamp(9px,3.1cqw,17px);color:var(--muted);transition:background .2s,color .2s,transform .2s}
.t.main{width:12.5%}
.t.spare{background:transparent;border:1px dashed var(--muted);font-size:clamp(8px,2.4cqw,13px)}
.t.on{background:var(--accent);color:var(--accent-ink);transform:translate(-50%,-50%) scale(1.3);font-weight:600;z-index:2}
.cap{text-align:center;color:var(--muted);font-size:14px;margin:14px 0 0}
@media (prefers-reduced-motion:reduce){.t{transition:none}}
</style>
</head>
<body>
<main>
<h1>11/22 琪鈞&amp;亞霓婚禮 座位查詢</h1>
<p class="sub">中午 里昂-凱旋+羅浮廳<br>輸入您的姓名，查詢出席人數與座位</p>
<form id="f" autocomplete="off">
<input id="q" type="search" placeholder="輸入姓名（全名或名字皆可）" aria-label="賓客姓名" enterkeyhint="search">
<button type="submit">查詢</button>
</form>
<div id="out" aria-live="polite"></div>
<div class="map" style="margin-top:28px">
<div class="floor" id="grid">
<div class="stage">舞台</div>
<div class="aisle"></div>
</div>
<p class="cap" id="cap">輸入姓名後，您的桌次會亮起</p>
<p class="cap">圖上方為舞台，下方為入口</p>
</div>
</main>
<script>
// 新人請修改這裡：依桌號列出賓客，格式「姓名*出席人數」（含本人）

var BY_TABLE={
1:["姑姑*1","叔叔*1","姨婆*1"],
3:["小姨*3","二姨*1","妹妹*2","慧芳*2","美秀*2"],
4:["育珊*3","明鳳*1","素華*2","惠珍*4"],
5:["浩北*2","雲霞*2","育瓊*1","小玲*1","秀芬*1","瑞萍*1","慧敏*2"],
6:["廖曼庭*3","曹靖民*3","陳盈聿*1","黃晴*1","余奇祐*1"],
7:["邱坤豪*1","黃文林*1","黃暄懿*1","黃筱淯*1","張書誠*1","王介昌*1","黃士峰*1","劉得民*1","涂孝樸*1","藍民遠*1"],
8:["陳律行*4","紀鈞能*1","江至淳*1","陳芊蓉*1","林念錡*1","黃毓庭*1","張國維*1"],
9:["林雨潔*1","劉岱錡*1","徐毓傑*1","莊知儒*1","林敏娟*2","紀姿羽*2","弘宇*1"],
10:["陳佩宜*2","吳宥達*2","黃灝文*1","郭琳喬*2","葉佳欣*1","鄭靜瑜*2"],
11:["陳仲均*1","林子堯*1","蔡泓沅*1","董磬中*1","黃偉家*1","陳楷屏*1","馬培原*2","張雯菁*1","周侑霖*1"],
12:["陳敦斌*1","尤心玫*1","沈傳傑*1","黃仁和*1","林淑蘋*1","曾國棟*1","林昇邦*3","徐孟瑋*2"],
13:["鍾正浩*1","李彥琦*1","王欣*1","蔡文雅*1","陳閎睿*2","高金泉*2","張東原*2"],
14:["周亞璇*1","周佩甄*1","鄭秉維*1","鄭沐鏞*1","鄭雲勝*1","周武中*3","周武林*2","曾國忠*1"],
15:["周隆安*1","周王麗花*1","陳建安*1","周春燕*1","林建男*1","周秀美*1","周敏*1","周阿葉*1","黄乃富*1","周秀蓮*1"],
16:["林志雄*4","謝素珍*3","謝素華*3"],
17:["廖雲根*1","葉芯妤*3","戴淑怡*3","葉子寧*2"],
18:["曾馨誼*1","周宏駿*1","周育勳*1","李旻珊*1","周淑芬*1","姚宏勳*1","周紫涵*1","楊慶文*1","周秋蓉*1","楊釉甯*1"],
19:["陳信衛*1","陳勝利*1","涂碧霞*2","鍾宗憲*1","魏彣育*1","李修銘*1","林家繽*3"],
20:["吳阿滿*1","周銘泉*1","陳宜静*1","周佳慧*1","宋狄釗*4","邱婉瑜*2"],
21:["李天慧*2","江以誠*2","林承德*2","立民*4"],
22:["蕭仟玫*1","王思渝*1","黃詩涵*1","溫翊如*2","俞姿廷*1","鄭祖昀*1","秦國揚*1","吳敬慧*1","葉宜蓁*1"],
23:["李後亨*2","余豐富*1","陳春櫻*2","謝光輝*2","陳建州*2","李戎亭*1"],
24:["文亞山*2","柯佐融*2","張仲昱*1","侯明瑤*1","簡淑芬*1","Aesop(游易旭)*1","李長峰*2"],
25:["陳亮宇*2","陳尚暐*2","鍾哥*2","許玄*1","明遠*1","黃華秀*1"],
26:["魏麗幸*1","賴新浩*2","邱秀鳳*1","羅淑珍*2","劉鳳萍*2","沈玉婷*1"]
};
var guests=[];
Object.keys(BY_TABLE).forEach(function(t){BY_TABLE[t].forEach(function(s){var m=s.match(/^(.*)\*(\d+)$/);guests.push({name:m?m[1]:s,count:m?+m[2]:1,table:+t})})});
var grid=document.getElementById("grid"),out=document.getElementById("out"),cap=document.getElementById("cap");
var X0=40,Y0=105,W=560,H=590;
var LAYOUT=[[2,78,222],[5,78,300],[8,78,388],[11,78,470],[13,78,548],["預備",78,632],[1,170,258],[4,170,343],[7,170,422],[10,170,500],[12,170,590],[3,258,357],[6,258,455],[9,260,545],[16,370,367],[19,370,455],[22,370,548],[14,460,258],[17,460,343],[20,460,425],[23,460,505],[25,460,590],[15,549,210],[18,549,295],[21,549,378],[24,549,455],[26,549,538],["預備",549,625],["主桌",312,240]];
LAYOUT.forEach(function(a){var d=document.createElement("div"),n=typeof a[0]==="number";d.className="t"+(a[0]==="主桌"?" main":"")+(a[0]==="預備"?" spare":"");if(n)d.id="t"+a[0];else if(a[0]==="主桌")d.id="t0";d.textContent=a[0];d.style.left=((a[1]-X0)/W*100)+"%";d.style.top=((a[2]-Y0)/H*100)+"%";grid.appendChild(d)});
function light(t){document.querySelectorAll(".t").forEach(function(e){e.classList.remove("on")});
 if(t!==null){document.getElementById("t"+t).classList.add("on");cap.textContent="您的座位在"+(t===0?"主桌":"第 "+t+" 桌")}else{cap.textContent="輸入姓名後，您的桌次會亮起"}}
function show(g){
 out.querySelectorAll(".card").forEach(function(c){c.classList.toggle("sel",c.dataset.n===g.name)});
 light(g.table);
}
document.getElementById("f").addEventListener("submit",function(e){
 e.preventDefault();
 var v=document.getElementById("q").value.trim();
 out.innerHTML="";light(null);
 if(v.length<2){out.innerHTML='<p class="msg">請輸入完整姓名（至少 2 個字）。</p>';return}
 var r=guests.filter(function(g){return g.name.indexOf(v)>-1||(g.name.length>=2&&v.indexOf(g.name)>-1)});
 if(!r.length){out.innerHTML='<p class="msg">找不到「'+v.replace(/[<>&]/g,"")+'」。請試試只輸入名字（不含姓氏），或洽詢接待桌。</p>';return}
 r.forEach(function(g){var b=document.createElement("button");b.type="button";b.className="card";b.dataset.n=g.name;
  b.innerHTML='<span><span class="nm"></span><br><span class="ct"></span></span><span class="tb">'+(g.table===0?"主桌":"第 "+g.table+" 桌")+'</span>';b.querySelector(".nm").textContent=g.name;b.querySelector(".ct").textContent="出席人數："+g.count+" 位";
  b.onclick=function(){show(g)};out.appendChild(b)});
 show(r[0]);
});
(function(){var q=document.getElementById("q"),f=document.getElementById("f");
function live(){if(q.value.trim().length<2){out.innerHTML="";light(null);return}f.dispatchEvent(new Event("submit",{cancelable:true}))}
q.addEventListener("input",function(e){if(!e.isComposing)live()});
q.addEventListener("compositionend",live)})();
</script>
</body>
</html>
